name: Sync election data

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/sync-election-data.yml"

permissions:
  contents: write

concurrency:
  group: election-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the next election and sync candidates
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: node scripts/sync-election-data.mjs
      - name: Commit changed public data
        run: |
          if git diff --quiet -- data/current-election.json; then
            echo "No election data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-election.json
          git commit -m "chore: update election data"
          git push

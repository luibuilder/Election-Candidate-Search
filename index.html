<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지방선거 후보 검증기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F4EE;
    --bg2: #EDEAE2;
    --ink: #1A1A18;
    --ink2: #4A4A45;
    --ink3: #8A8A82;
    --accent: #2B4C3F;
    --accent2: #4A7C5E;
    --accent-light: #E1EDE7;
    --warn: #8B4513;
    --warn-light: #FDF0E6;
    --danger: #7A2020;
    --danger-light: #FCE8E8;
    --border: #D4CFC4;
    --gold: #B8860B;
    --gold-light: #FFF8E1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.6;
  }

  .masthead {
    background: var(--accent);
    color: #F7F4EE;
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .masthead::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 220px; height: 220px;
    border: 1px solid rgba(247,244,238,0.1);
    border-radius: 50%;
  }

  .masthead::after {
    content: '';
    position: absolute;
    bottom: -80px; right: -40px;
    width: 300px; height: 300px;
    border: 1px solid rgba(247,244,238,0.08);
    border-radius: 50%;
  }

  .masthead-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(247,244,238,0.6);
    margin-bottom: 0.75rem;
    font-weight: 300;
  }

  .masthead h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }

  .masthead-sub {
    font-size: 0.9rem;
    color: rgba(247,244,238,0.7);
    font-weight: 300;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .search-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2rem;
    box-shadow: 0 2px 20px rgba(43,76,63,0.06);
  }

  .search-card h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-card h2::before {
    content: '✦';
    font-size: 0.75rem;
  }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-group label {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink2);
    letter-spacing: 0.03em;
  }

  .input-group input,
  .input-group select {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
  }

  .input-group input:focus,
  .input-group select:focus {
    border-color: var(--accent2);
    background: #fff;
  }

  .btn-analyze {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #F7F4EE;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
  }

  .btn-analyze:hover { background: #1F3A2E; }
  .btn-analyze:active { transform: scale(0.99); }
  .btn-analyze:disabled { background: var(--ink3); cursor: not-allowed; }

  .criteria-strip {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 2rem;
  }

  .criterion-pill {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
    font-size: 10.5px;
    color: var(--ink2);
    line-height: 1.4;
    font-weight: 400;
  }

  .criterion-pill .num {
    display: block;
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .loading-state {
    display: none;
    text-align: center;
    padding: 3rem 1rem;
  }

  .loading-state.active { display: block; }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-msg {
    font-size: 0.9rem;
    color: var(--ink2);
    margin-bottom: 0.5rem;
  }

  .loading-steps {
    font-size: 0.8rem;
    color: var(--ink3);
  }

  .result-area { display: none; }
  .result-area.active { display: block; }

  .result-header {
    border-bottom: 2px solid var(--accent);
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .result-header h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--ink);
  }

  .result-header .meta {
    font-size: 0.8rem;
    color: var(--ink3);
    text-align: right;
  }

  .score-banner {
    background: var(--accent);
    color: #F7F4EE;
    border-radius: 12px;
    padding: 1.5rem 2rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .score-label {
    font-size: 0.85rem;
    opacity: 0.75;
    margin-bottom: 4px;
  }

  .score-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 3.5rem;
    font-weight: 700;
    line-height: 1;
  }

  .score-unit {
    font-size: 1.2rem;
    opacity: 0.6;
    margin-left: 4px;
  }

  .score-verdict {
    text-align: right;
  }

  .verdict-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .verdict-good { background: rgba(247,244,238,0.2); border: 1px solid rgba(247,244,238,0.4); }
  .verdict-caution { background: rgba(255,200,100,0.3); border: 1px solid rgba(255,200,100,0.4); }
  .verdict-warning { background: rgba(255,100,100,0.3); border: 1px solid rgba(255,100,100,0.4); }

  .score-summary {
    font-size: 0.85rem;
    opacity: 0.8;
    max-width: 260px;
    text-align: right;
    line-height: 1.5;
  }

  .checklist-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.85rem;
  }

  .check-icon {
    font-size: 16px;
    flex-shrink: 0;
  }

  .check-pass { color: var(--accent2); }
  .check-fail { color: var(--danger); }
  .check-unknown { color: var(--ink3); }

  .section-block {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1rem;
    overflow: hidden;
  }

  .section-header {
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    transition: background 0.15s;
  }

  .section-header:hover { background: var(--bg2); }

  .section-title {
    font-weight: 500;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-num {
    width: 26px;
    height: 26px;
    background: var(--accent);
    color: #F7F4EE;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Noto Serif KR', serif;
    flex-shrink: 0;
  }

  .section-score {
    font-size: 0.85rem;
    font-weight: 500;
    padding: 3px 12px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .score-high { background: var(--accent-light); color: var(--accent); }
  .score-mid { background: var(--gold-light); color: var(--gold); }
  .score-low { background: var(--danger-light); color: var(--danger); }
  .score-na { background: var(--bg2); color: var(--ink3); }

  .section-body {
    padding: 1.25rem;
    display: none;
  }

  .section-body.open { display: block; }

  .section-body p {
    font-size: 0.9rem;
    color: var(--ink2);
    line-height: 1.75;
    margin-bottom: 0.75rem;
  }

  .section-body p:last-child { margin-bottom: 0; }

  .highlight-box {
    background: var(--accent-light);
    border-left: 3px solid var(--accent2);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: var(--accent);
    margin-bottom: 0.75rem;
    line-height: 1.6;
  }

  .warn-box {
    background: var(--warn-light);
    border-left: 3px solid var(--warn);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: var(--warn);
    margin-bottom: 0.75rem;
    line-height: 1.6;
  }

  .danger-box {
    background: var(--danger-light);
    border-left: 3px solid var(--danger);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: var(--danger);
    margin-bottom: 0.75rem;
    line-height: 1.6;
  }

  .chevron {
    font-size: 12px;
    color: var(--ink3);
    transition: transform 0.2s;
  }

  .section-header.open .chevron { transform: rotate(180deg); }

  .final-verdict {
    background: var(--accent);
    color: #F7F4EE;
    border-radius: 12px;
    padding: 1.75rem 2rem;
    margin-top: 1.5rem;
  }

  .final-verdict h3 {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.1rem;
    margin-bottom: 1rem;
    opacity: 0.85;
  }

  .final-verdict p {
    font-size: 0.9rem;
    line-height: 1.8;
    opacity: 0.85;
  }

  .disclaimer {
    text-align: center;
    font-size: 0.78rem;
    color: var(--ink3);
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    line-height: 1.7;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg2);
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 1.5rem;
  }

  .tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    font-size: 0.82rem;
    border-radius: 6px;
    cursor: pointer;
    color: var(--ink3);
    transition: all 0.15s;
    font-weight: 400;
  }

  .tab.active {
    background: #fff;
    color: var(--accent);
    font-weight: 500;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .error-state {
    display: none;
    background: var(--danger-light);
    border: 1px solid #F0A0A0;
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
    color: var(--danger);
    line-height: 1.6;
  }

  .error-state.active { display: block; }

  @media (max-width: 600px) {
    .input-row { grid-template-columns: 1fr; }
    .checklist-grid { grid-template-columns: 1fr; }
    .criteria-strip { grid-template-columns: repeat(4, 1fr); }
    .score-banner { flex-direction: column; gap: 1rem; text-align: center; }
    .score-verdict { text-align: center; }
    .score-summary { text-align: center; max-width: 100%; }
    .masthead h1 { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-eyebrow">2026 지방선거</div>
  <h1>후보 검증 분석기</h1>
  <p class="masthead-sub">7가지 기준으로 우리 지역 후보를 제대로 평가하세요</p>
</div>

<div class="container">

  <div class="criteria-strip">
    <div class="criterion-pill"><span class="num">1</span>권한<br>이해</div>
    <div class="criterion-pill"><span class="num">2</span>공약<br>구체성</div>
    <div class="criterion-pill"><span class="num">3</span>과거<br>경력</div>
    <div class="criterion-pill"><span class="num">4</span>재산<br>기록</div>
    <div class="criterion-pill"><span class="num">5</span>토론회<br>태도</div>
    <div class="criterion-pill"><span class="num">6</span>언론<br>균형</div>
    <div class="criterion-pill"><span class="num">7</span>주민<br>평가</div>
  </div>

  <div class="search-card">
    <h2>후보 정보 입력</h2>
    <div class="input-row">
      <div class="input-group">
        <label>후보자 이름</label>
        <input type="text" id="candidateName" placeholder="예: 홍길동" />
      </div>
      <div class="input-group">
        <label>선거구 (시·도·구)</label>
        <input type="text" id="region" placeholder="예: 서울시 강남구" />
      </div>
    </div>
    <div class="input-row">
      <div class="input-group">
        <label>선거 종류</label>
        <select id="electionType">
          <option value="기초단체장">기초단체장 (시장·군수·구청장)</option>
          <option value="광역단체장">광역단체장 (시·도지사)</option>
          <option value="지방의원">지방의원</option>
          <option value="교육감">교육감</option>
        </select>
      </div>
      <div class="input-group">
        <label>소속 정당 (선택)</label>
        <input type="text" id="party" placeholder="예: 국민의힘, 더불어민주당 등" />
      </div>
    </div>
    <button class="btn-analyze" id="analyzeBtn" onclick="analyze()">
      AI 검증 분석 시작하기 →
    </button>
  </div>

  <div class="error-state" id="errorState"></div>

  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <div class="loading-msg" id="loadingMsg">후보 정보를 분석하고 있습니다...</div>
    <div class="loading-steps" id="loadingSteps">웹 검색 및 7가지 기준 평가 중</div>
  </div>

  <div class="result-area" id="resultArea"></div>

</div>

<script>
const loadingMessages = [
  ["공약집 및 선관위 자료 검색 중...", "출마 이력 및 경력 분석 중"],
  ["재산·전과 기록 확인 중...", "지역 현안 연관성 평가 중"],
  ["토론회 언급 기사 검토 중...", "7가지 기준 종합 평가 작성 중"],
];

let loadingInterval;

function startLoadingAnimation() {
  let step = 0;
  loadingInterval = setInterval(() => {
    const msgs = loadingMessages[step % loadingMessages.length];
    document.getElementById('loadingMsg').textContent = msgs[0];
    document.getElementById('loadingSteps').textContent = msgs[1];
    step++;
  }, 2500);
}

function stopLoadingAnimation() {
  if (loadingInterval) clearInterval(loadingInterval);
}

async function analyze() {
  const name = document.getElementById('candidateName').value.trim();
  const region = document.getElementById('region').value.trim();
  const type = document.getElementById('electionType').value;
  const party = document.getElementById('party').value.trim();

  if (!name || !region) {
    showError('후보자 이름과 선거구를 모두 입력해주세요.');
    return;
  }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  document.getElementById('errorState').classList.remove('active');
  document.getElementById('resultArea').classList.remove('active');
  document.getElementById('loadingState').classList.add('active');
  startLoadingAnimation();

  const partyInfo = party ? `소속 정당: ${party}` : '소속 정당: 미입력';

  const systemPrompt = `당신은 대한민국 지방선거 후보 검증 전문가입니다. 주어진 후보에 대해 7가지 기준으로 심층 분석을 제공합니다.
반드시 아래 JSON 형식으로만 응답하세요. JSON 외 다른 텍스트는 절대 포함하지 마세요.

{
  "totalScore": 0~100 사이 정수,
  "verdict": "적합" | "보통" | "주의필요",
  "verdictSummary": "전반적 종합 평가 2~3문장",
  "checklist": {
    "regionIssues": true/false,
    "budgetPlan": true/false,
    "trackRecord": true/false,
    "cleanRecord": true/false,
    "debateReady": true/false
  },
  "sections": [
    {
      "id": 1,
      "title": "권한 이해도",
      "score": 0~100,
      "level": "high"/"mid"/"low"/"na",
      "summary": "한 줄 요약",
      "analysis": "상세 분석 (3~5문장, 구체적 정보 포함)",
      "highlight": "긍정적 포인트 (있으면)",
      "warning": "주의사항 (있으면)"
    },
    ... 7개 모두
  ],
  "finalAdvice": "투표 전 최종 조언 3~4문장. 확인해야 할 구체적 자료나 행동 포함."
}

7개 섹션은 순서대로:
1. 권한 이해도 - ${type} 역할에 맞는 정책(교통/주거/복지/교육/지역경제)을 말하는지, 외교·안보 이야기를 하는지
2. 공약 구체성 - 무엇/얼마나/재원/언제가 있는지 ('무엇을' 없으면 level:low)
3. 과거 경력 - 공직 경험, 의정활동 실적, 공약 이행률, 전문 분야
4. 재산·세금·전과 - 재산 형성 합리성, 세금 체납, 전과 내용(시기 중요)
5. 토론회 태도 - 질문에 직접 답하는지, 정책 설명 vs 상대 비난
6. 언론 보도 균형 - 다양한 언론 평가, 선관위 공식 자료와 차이
7. 주민·시민사회 평가 - 지역 커뮤니티, 시민단체, 주민 실제 평가

※ 구체적으로 알려진 정보가 없으면 솔직하게 "공개 정보 부족"으로 표시하고 level:"na"로 설정.
※ 과도한 칭찬이나 비난 없이 중립적이고 사실 중심으로 작성.
※ 한국어로 작성.`;

  const userPrompt = `후보 정보:
- 이름: ${name}
- 선거구: ${region}
- 선거 종류: ${type}
- ${partyInfo}

위 후보에 대해 7가지 기준으로 분석해주세요. 웹 검색을 통해 실제 알려진 정보를 최대한 반영하고, 모르는 부분은 솔직히 "정보 부족"으로 표시하세요.`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 3000,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        system: systemPrompt,
        messages: [{ role: "user", content: userPrompt }]
      })
    });

    if (!response.ok) {
      throw new Error(`API 오류: ${response.status}`);
    }

    const data = await response.json();
    stopLoadingAnimation();
    document.getElementById('loadingState').classList.remove('active');

    const textBlock = data.content.find(b => b.type === 'text');
    if (!textBlock) throw new Error('응답 없음');

    let jsonStr = textBlock.text.trim();
    jsonStr = jsonStr.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();

    const result = JSON.parse(jsonStr);
    renderResult(result, name, region, type);

  } catch (err) {
    stopLoadingAnimation();
    document.getElementById('loadingState').classList.remove('active');
    showError(`분석 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요. (${err.message})`);
  }

  btn.disabled = false;
}

function showError(msg) {
  const el = document.getElementById('errorState');
  el.textContent = msg;
  el.classList.add('active');
}

function getScoreClass(score) {
  if (score >= 65) return 'score-high';
  if (score >= 40) return 'score-mid';
  if (score === 0 || score === null) return 'score-na';
  return 'score-low';
}

function getScoreLabel(level, score) {
  if (level === 'na') return '정보 없음';
  if (level === 'high' || score >= 65) return '양호';
  if (level === 'mid' || score >= 40) return '보통';
  return '미흡';
}

function getVerdictBadge(verdict) {
  if (verdict === '적합') return 'verdict-good';
  if (verdict === '보통') return 'verdict-caution';
  return 'verdict-warning';
}

function getScoreBannerClass(score) {
  if (score >= 65) return '';
  return '';
}

function renderResult(data, name, region, type) {
  const checkItems = [
    { key: 'regionIssues', label: '지역 현안 파악' },
    { key: 'budgetPlan', label: '예산·일정 제시' },
    { key: 'trackRecord', label: '과거 실적 있음' },
    { key: 'cleanRecord', label: '재산·전과 무이슈' },
    { key: 'debateReady', label: '정책 설명 능력' },
  ];

  const checkHtml = checkItems.map(item => {
    const val = data.checklist[item.key];
    const icon = val === true ? '✓' : val === false ? '✗' : '?';
    const cls = val === true ? 'check-pass' : val === false ? 'check-fail' : 'check-unknown';
    return `<div class="check-item">
      <span class="check-icon ${cls}">${icon}</span>
      <span>${item.label}</span>
    </div>`;
  }).join('');

  const sectionsHtml = (data.sections || []).map((sec, i) => {
    const scoreClass = getScoreClass(sec.score);
    const scoreLabel = getScoreLabel(sec.level, sec.score);
    const highlightHtml = sec.highlight ? `<div class="highlight-box">${sec.highlight}</div>` : '';
    const warningHtml = sec.warning ? `<div class="warn-box">⚠ ${sec.warning}</div>` : '';
    return `<div class="section-block">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-title">
          <div class="section-num">${sec.id}</div>
          ${sec.title}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="section-score ${scoreClass}">${scoreLabel}</div>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="section-body">
        ${highlightHtml}
        ${warningHtml}
        <p>${sec.analysis || sec.summary}</p>
      </div>
    </div>`;
  }).join('');

  const verdictClass = getVerdictBadge(data.verdict);
  const scoreColor = data.totalScore >= 65 ? '#4A7C5E' : data.totalScore >= 40 ? '#B8860B' : '#A32D2D';

  const html = `
    <div class="result-header">
      <h2>${name} 후보 분석 결과</h2>
      <div class="meta">${region} · ${type}<br>${new Date().toLocaleDateString('ko-KR')} 기준</div>
    </div>

    <div class="score-banner">
      <div>
        <div class="score-label">종합 검증 점수</div>
        <div class="score-num">${data.totalScore}<span class="score-unit">/100</span></div>
      </div>
      <div class="score-verdict">
        <div class="verdict-badge ${verdictClass}">${data.verdict}</div>
        <div class="score-summary">${data.verdictSummary}</div>
      </div>
    </div>

    <div style="margin-bottom:1.25rem">
      <div style="font-size:12px;color:var(--ink3);margin-bottom:8px;font-weight:500;letter-spacing:0.04em">5분 체크리스트</div>
      <div class="checklist-grid">${checkHtml}</div>
    </div>

    <div style="font-size:12px;color:var(--ink3);margin-bottom:10px;font-weight:500;letter-spacing:0.04em">7가지 기준 상세 분석 (항목 클릭 시 펼쳐짐)</div>
    ${sectionsHtml}

    <div class="final-verdict">
      <h3>✦ 투표 전 최종 조언</h3>
      <p>${data.finalAdvice}</p>
    </div>

    <div class="disclaimer">
      ※ 이 분석은 AI가 공개 정보를 바탕으로 생성한 참고 자료입니다.<br>
      최종 판단은 선관위 공식 자료·토론회 영상·후보 공약집을 직접 확인하신 후 내려주세요.<br>
      <strong><a href="https://info.nec.go.kr" target="_blank" style="color:var(--accent)">중앙선거관리위원회 →</a></strong>
    </div>
  `;

  const area = document.getElementById('resultArea');
  area.innerHTML = html;
  area.classList.add('active');

  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleSection(header) {
  header.classList.toggle('open');
  const body = header.nextElementSibling;
  body.classList.toggle('open');
}

document.getElementById('candidateName').addEventListener('keydown', e => {
  if (e.key === 'Enter') analyze();
});
document.getElementById('region').addEventListener('keydown', e => {
  if (e.key === 'Enter') analyze();
});
</script>
</body>
</html>
